---

name: Acceptance Tests

on:  # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches: [3.x]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  acceptance:
    name: PHP ${{ matrix.php }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.2', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sockets
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      # rr runs against a fake GitHub started by the tests (tests/Acceptance/Server)
      - name: Run acceptance tests
        run: php vendor/bin/testo --suite=Acceptance

  # rr against the real GitHub: about 6 API requests per job with a cold DLoad cache, 5 with a warm one
  live:
    name: Live GitHub
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      DLOAD_CACHE_DIR: ${{ github.workspace }}/runtime/dload-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sockets
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest

      # Release metadata only, no binaries or tokens. A cache key is never overwritten,
      # so every run saves its own registry and the next run starts from the newest one.
      - name: Restore DLoad version registry
        uses: actions/cache@v6
        with:
          path: runtime/dload-cache
          key: dload-registry-${{ runner.os }}-${{ github.run_id }}
          restore-keys: dload-registry-${{ runner.os }}-

      - name: GitHub API usage before
        run: gh api rate_limit --jq '.resources.core | "used \(.used) of \(.limit)"'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run live tests
        run: php vendor/bin/testo --suite=Live
        env:
          RR_CLI_LIVE_TESTS: '1'
          GITHUB_TOKEN: ${{ github.token }}

      - name: GitHub API usage after
        if: always()
        run: gh api rate_limit --jq '.resources.core | "used \(.used) of \(.limit)"'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
